# ============================================================================
#  tmux.conf — Kanagawa Wave theme
#  tmux 3.7+  |  Reload: <prefix> r   (prefix = C-a)
#  Requires a Nerd Font for the status-bar icons/separators.
# ============================================================================

# ----------------------------------------------------------------------------
# Kanagawa Wave palette (reference — used inline below)
#   ink0 #16161D   ink1 #1F1F28   ink2 #2A2A37   ink3 #363646   ink4 #54546D
#   fg   #DCD7BA   dim  #C8C093   gray #727169
#   blue #7E9CD8   purple #957FB8 red  #E46876   orange #FFA066
#   yellow #E6C384 aqua #7AA89F  teal #6A9589    green #98BB6C
# ----------------------------------------------------------------------------


# ============================================================================
# 1. Core behaviour
# ============================================================================
set -s default-terminal "tmux-256color"          # best terminfo for true colour
set -g default-shell "/opt/homebrew/bin/nu"       # use nushell in panes (not fish)
set -as terminal-overrides ",*256col*:Tc"        # enable 24-bit (true) colour
# Keep Ghostty's native scrollback instead of translating scroll to ↑/↓
# set -as terminal-overrides ',xterm-ghostty:smcup@:rmcup@'
set -s escape-time 0                             # snappier key handling (vim)
set -s focus-events on                           # detect terminal focus changes
set -s set-clipboard on                          # sync copy buffer w/ pbcopy/pbpaste
set -s extended-keys on                          # request extended keys from terminal
set -s extended-keys-format csi-u                # emit CSI-u to apps in panes
set -as terminal-features "xterm-ghostty*:extkeys"   # Ghostty: kitty keyboard proto
set -g set-titles on                             # mirror session/window in terminal title
set -g set-titles-string "#S · #I:#W"
set -g allow-passthrough on                      # let apps push OSC 52 to Ghostty

set -g base-index 1                              # windows start at 1
set -wg pane-base-index 1                        # panes start at 1
set -g renumber-windows on                       # renumber after closing
set -g history-limit 100000                      # large scrollback
set -g display-time 4000                         # message duration (ms)
set -g repeat-time 400                           # time to repeat a -r binding
set -g allow-rename off                          # keep explicit window names
set -wg automatic-rename on
set -g detach-on-destroy off                     # don't kill session on last pane
set -g mouse off                                  # mouse select/scroll/resize

# Optional: tint inactive panes (uncomment if you like the look)
# set -g window-style "bg=#16161D"
# set -g window-active-style "bg=#1F1F28"


# ============================================================================
# 2. Prefix & key bindings
# ============================================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix                            # C-a C-a sends literal C-a

# Reload this config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Windows & sessions
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind Tab last-window
bind s choose-tree                                # pick a session
bind w choose-tree -w                             # pick a window

# Window switching without prefix (Ghostty tab replacement)
bind -n C-Tab next-window                         # Ctrl+Tab      -> next window
bind -n C-BTab previous-window                    # Ctrl+Shift+Tab -> previous window

# Splits (keep current directory)
bind "|" split-window -h -c "#{pane_current_path}"
bind "\\" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
bind "_" split-window -v -c "#{pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-free pane navigation (Option+hjkl — needs Ghostty: macos-option-as-alt)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Misc
bind z resize-pane -Z                             # zoom a pane
bind -r "<" swap-window -t -1                     # move window left
bind -r ">" swap-window -t +1                     # move window right
bind e setw synchronize-panes                     # toggle pane sync
bind p popup -d '#{pane_current_path}'             # scratchpad shell in pane's cwd


# ============================================================================
# 3. Copy mode (vi) + clipboard
# ============================================================================
set -g status-keys vi
set -wg mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind P paste-buffer                              # <prefix> P pastes


# ============================================================================
# 4. Styling — panes, messages, popups (Kanagawa Wave)
# ============================================================================
set -g pane-border-style "fg=#363646"
set -g pane-active-border-style "fg=#7E9CD8"
set -g display-panes-colour "#54546D"
set -g display-panes-active-colour "#7E9CD8"

set -g message-style "fg=#DCD7BA,bg=#2A2A37"
set -g message-command-style "fg=#DCD7BA,bg=#2A2A37"
set -g mode-style "fg=#16161D,bg=#7E9CD8"

set -g popup-style "fg=#DCD7BA,bg=#16161D"
set -g popup-border-style "fg=#7E9CD8"


# ============================================================================
# 5. Status bar — Kanagawa Wave
# ============================================================================
set -g status on
set -g status-position bottom
set -g status-style "bg=#1F1F28,fg=#DCD7BA"
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 140

# Left: session name in a blue block; red PREFIX indicator while the prefix key is held
set -g status-left "#[fg=#16161D,bg=#7E9CD8,bold]  #S #{?client_prefix,#[bg=#E46876]#[fg=#16161D]#[bold] PREFIX #[fg=#E46876]#[bg=#1F1F28]▌,#[fg=#7E9CD8]#[bg=#1F1F28]▌}"

# Inactive windows: muted grey text
setw -g window-status-format " #[fg=#727169,bg=#1F1F28]#I:#W "
# Active window: teal "pill" with square edges
setw -g window-status-current-format "#[fg=#7AA89F,bg=#1F1F28]▐#[bg=#7AA89F,fg=#16161D,bold] #I:#W #[fg=#7AA89F,bg=#1F1F28]▌"
setw -g window-status-separator ""
setw -g window-status-last-style "fg=#C0A36E,bg=#1F1F28"
setw -g window-status-activity-style "fg=#E6C384,bg=#1F1F28,bold"
setw -g window-status-bell-style "fg=#E46876,bg=#1F1F28,bold"

# Right: battery · git branch of the focused pane (teal block, only when inside a repo)
# macOS battery via pmset — swap for `#{battery_percentage}` on Linux
set -g status-right "#[fg=#E6C384,bg=#1F1F28]  #(pmset -g batt | grep -Eo '[0-9]+%' | head -1) #{?#{==:#(git -C \"#{pane_current_path}\" symbolic-ref --short HEAD 2>/dev/null),},,#[fg=#363646]#[bg=#1F1F28]│ #[fg=#7AA89F]#[bg=#1F1F28]▐#[bg=#7AA89F]#[fg=#16161D]#[bold]  #(git -C \"#{pane_current_path}\" symbolic-ref --short HEAD 2>/dev/null) }"


# ============================================================================
# 6. Plugins (tpm) — optional but recommended
#    Install once:  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#    Then inside tmux: <prefix> I  to install the plugins below.
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Only runs tpm if it is installed (safe to load without it)
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run "~/.tmux/plugins/tpm/tpm"'
